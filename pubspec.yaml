name: flutter_printlink
description: A comprehensive Flutter plugin for thermal printer integration with AutoReplyPrint library. Supports Bluetooth, USB, Network connections with label and POS printing modes for Android and iOS.
version: 1.0.0
homepage: https://github.com/Shehzaan-Mansuri/flutter_printlink
repository: https://github.com/Shehzaan-Mansuri/flutter_printlink
issue_tracker: https://github.com/Shehzaan-Mansuri/flutter_printlink/issues
documentation: https://github.com/Shehzaan-Mansuri/flutter_printlink/blob/main/README.md

topics:
  - thermal-printer
  - pos-printer
  - bluetooth-printer
  - barcode
  - qr-code

environment:
  sdk: ">=2.12.0 <4.0.0"
  flutter: ">=2.5.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.caysn.flutter_printlink
        pluginClass: FlutterThermalPrinterPlugin
      ios:
        pluginClass: FlutterThermalPrinterPlugin
